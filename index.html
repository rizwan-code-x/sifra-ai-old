  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sifra - Professional AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
        },
      },
    }
    </script>
    <style>
      /* Extreme Performance Core for 120Hz+ Screens */
      :root {
        --sifra-spring: cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      html, body {
        background-color: #000;
        scrollbar-gutter: stable;
        overflow: hidden;
        height: 100%;
        width: 100%;
        scroll-behavior: smooth;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        box-sizing: border-box;
      }

      /* Native High-Performance Scrolling */
      .premium-scroll {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        overscroll-behavior-y: contain;
        scrollbar-width: none;
        transform: translateZ(0); /* Force Layer Promotion */
        will-change: transform, scroll-position;
        backface-visibility: hidden;
        perspective: 1000px;
      }
      
      .premium-scroll::-webkit-scrollbar {
        display: none;
      }

      /* GPU-Accelerated UI Elements */
      .gpu-layer {
        transform: translateZ(0);
        will-change: transform, opacity;
        backface-visibility: hidden;
      }

      /* Ultra-Smooth Transitions */
      .page-transition {
        transition: transform 0.4s var(--sifra-spring), opacity 0.3s ease;
      }

      /* Active State Feedback - Fast and Snappy */
      .active-scale:active {
        transform: scale(0.96);
        transition: transform 0.1s var(--sifra-spring);
      }

      /* Glassmorphism Optimization */
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transform: translateZ(0);
      }
    </style>
